<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Archivo+Narrow:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --table: #EDF1F3;        /* light table */
    --table-glow: #F7F9FA;
    --film: #2A2119;         /* film base */
    --edge: #C98A3A;         /* frame-edge printing */
    --pencil: #B4322A;       /* grease pencil */
    --ink: #1E2428;
    --slate: #6B767D;
    --line: #D3DADE;
    --ui: "Archivo", system-ui, sans-serif;
    --edge-font: "Archivo Narrow", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 0%, var(--table-glow), var(--table) 70%);
    background-color: var(--table);
    color: var(--ink);
    font: 400 16px/1.5 var(--ui);
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px; }

  /* ---------- header ---------- */
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; }
  h1 { font: 700 2.4rem/1.05 var(--ui); letter-spacing: -0.02em; margin: 0; }
  .sub { margin: 6px 0 0; color: var(--slate); font-size: 0.95rem; }
  .leader-box { text-align: right; }
  .leader-box .label { font: 500 0.85rem/1.2 var(--ui); color: var(--slate); }
  .leader-box .host { font: 700 1.3rem/1.25 var(--ui); margin-top: 2px; }
  .leader-box .id { font: 500 0.95rem var(--ui); color: var(--slate); }
  .nodes { margin-top: 24px; }
  .nodes h2 { margin-bottom: 8px; }
  .nodes table { border-collapse: collapse; width: 100%; max-width: 560px; font-size: 0.95rem; }
  .nodes th { text-align: left; font-weight: 500; color: var(--slate); padding: 4px 16px 4px 0; border-bottom: 1px solid var(--line); }
  .nodes td { padding: 6px 16px 6px 0; border-bottom: 1px solid var(--line); }
  .nodes tr.is-leader td { font-weight: 700; }
  .nodes .down { color: var(--pencil); }

  /* ---------- drop area ---------- */
  .drop {
    margin-top: 28px; border: 2px dashed var(--line); border-radius: 6px;
    padding: 34px 24px; display: grid; gap: 8px; justify-items: start;
    background: rgba(255,255,255,0.45); transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: var(--edge); background: rgba(201,138,58,0.08); }
  .drop strong { font: 700 1.25rem/1.3 var(--ui); }
  .drop p { margin: 0; color: var(--slate); }
  .choose {
    margin-top: 6px; font: 500 0.95rem var(--ui); color: #fff; background: var(--film);
    border: 0; border-radius: 4px; padding: 10px 16px; cursor: pointer;
  }
  .choose:hover { background: #3A2E24; }
  :focus-visible { outline: 3px solid var(--edge); outline-offset: 2px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* ---------- upload list ---------- */
  .uploads { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 6px; }
  .uploads li { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: baseline;
    padding: 8px 12px; background: rgba(255,255,255,0.6); border-left: 3px solid var(--line); }
  .uploads li.saved { border-left-color: #3F7D5A; }
  .uploads li.waiting { border-left-color: var(--edge); }
  .uploads li.failed { border-left-color: var(--pencil); }
  .uploads .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uploads .state { color: var(--slate); font-size: 0.9rem; text-align: right; }
  .uploads li.failed .state { color: var(--pencil); }

  /* ---------- contact sheet ---------- */
  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; margin: 44px 0 12px; gap: 12px; }
  h2 { font: 700 1.3rem var(--ui); margin: 0; }
  .count { color: var(--slate); font-size: 0.95rem; }
  .strip {
    background: var(--film); border-radius: 3px; padding: 22px 14px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px;
    /* sprocket holes along both edges */
    background-image:
      radial-gradient(circle, var(--table) 0 3px, transparent 3.5px),
      radial-gradient(circle, var(--table) 0 3px, transparent 3.5px);
    background-size: 18px 22px, 18px 22px;
    background-position: 0 -4px, 0 calc(100% + 4px);
    background-repeat: repeat-x;
  }
  .frame { margin: 0; color: var(--edge); }
  .frame a { display: block; aspect-ratio: 1; background: #120D09; overflow: hidden; border-radius: 2px; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame figcaption { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px;
    font: 600 0.78rem/1.2 var(--edge-font); }
  .frame .file { color: #B8A994; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { grid-column: 1 / -1; color: #B8A994; padding: 28px 8px; text-align: center; font-size: 0.95rem; }

  .notice { margin-top: 18px; padding: 10px 14px; border-left: 3px solid var(--pencil);
    background: rgba(180,50,42,0.06); display: none; }
  .notice.show { display: block; }

  @media (max-width: 600px) {
    .wrap { padding: 22px 16px 48px; }
    h1 { font-size: 1.9rem; }
    .leader-box { text-align: left; }
    .nodes table { font-size: 0.9rem; }
    .nodes th, .nodes td { padding-right: 10px; }
    .choose { width: 100%; text-align: center; padding: 14px 16px; }   /* big thumb target */
    .drop { padding: 22px 18px; }
    .strip { grid-template-columns: repeat(2, 1fr); padding: 20px 10px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Shared album</h1>
      <p class="sub" id="sub">Every photo is kept on every machine.</p>
    </div>
    <div class="leader-box" id="leader" aria-live="polite"></div>
  </header>

  <section class="nodes" aria-live="polite">
    <h2 id="nodes-title">Nodes</h2>
    <table>
      <thead><tr><th>node_id</th><th>Hostname</th><th>Role</th><th>State</th></tr></thead>
      <tbody id="nodes"></tbody>
    </table>
  </section>

  <div class="notice" id="notice" role="status"></div>

  <section class="drop" id="drop" aria-label="Upload photos">
    <strong id="drop-title">Drop photos here</strong>
    <p id="limit">Large photos are made smaller before upload.</p>
    <label class="choose" for="files" tabindex="0">Choose photos</label>
    <input type="file" id="files" accept="image/*" multiple>
  </section>
  <ul class="uploads" id="uploads" aria-live="polite"></ul>

  <div class="sheet-head">
    <h2>Contact sheet</h2>
    <span class="count" id="count"></span>
  </div>
  <div class="strip" id="strip"><p class="empty">No photos yet. Upload one to start the roll.</p></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let status = null;            // last /api/status from this node
let shown = "";               // signature of the rendered gallery, to avoid redrawing

// ---------- ids ----------
// crypto.randomUUID() only exists on HTTPS or localhost, and this page runs over plain HTTP
// on the LAN, so build a v4 UUID from getRandomValues, which works everywhere.
function uuid4() {
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

// ---------- cluster status ----------
async function refreshStatus() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    status = await r.json();
    $("notice").classList.remove("show");
  } catch {
    status = null;
    showNotice("This machine isn't answering. Open the album from another machine's address.");
  }
  drawLeader();
  return status;
}

const hostnames = {};      // node_id -> hostname; each node reports its own name in /api/status

async function hostnameOf(n) {
  if (n.self) return status.hostname;
  if (hostnames[n.id]) return hostnames[n.id];
  if (!n.alive || !n.url) return null;
  try {
    const st = await (await fetch(n.url + "/api/status", { cache: "no-store" })).json();
    hostnames[n.id] = st.hostname;
    return st.hostname;
  } catch { return null; }            // that node isn't reachable from this browser
}

async function drawLeader() {
  const box = $("leader"), rows = $("nodes");
  if (!status) { box.innerHTML = ""; rows.innerHTML = ""; return; }
  const nodes = [...status.nodes].sort((a, b) => a.id - b.id);
  const names = await Promise.all(nodes.map(hostnameOf));

  box.innerHTML = `<div class="label">Leader</div><div class="host"></div><div class="id"></div>`;
  if (status.leader == null) {
    box.querySelector(".host").textContent = "Electing…";
  } else {
    const i = nodes.findIndex((n) => n.id === status.leader);
    box.querySelector(".host").textContent = (i >= 0 && names[i]) || `Node ${status.leader}`;
    box.querySelector(".id").textContent = `node_id ${status.leader}` + (status.is_leader ? " (this machine)" : "");
  }

  $("nodes-title").textContent = `Nodes (${nodes.length})`;
  rows.innerHTML = "";
  nodes.forEach((n, i) => {
    const tr = document.createElement("tr");
    if (n.id === status.leader) tr.className = "is-leader";
    const cells = [
      String(n.id),
      (names[i] ?? "unknown") + (n.self ? " (this one)" : ""),
      n.id === status.leader ? "Leader" : "Backup",
      n.alive ? "Up" : "Down",
    ];
    for (const c of cells) { const td = document.createElement("td"); td.textContent = c; tr.appendChild(td); }
    if (!n.alive) tr.lastChild.className = "down";
    rows.appendChild(tr);
  });
  $("sub").textContent = status.leader == null
    ? "Choosing which machine receives uploads…"
    : `Every photo is kept on all ${nodes.length} machines.`;
}

function showNotice(text) { const n = $("notice"); n.textContent = text; n.classList.add("show"); }

// The leader's address: this page's own origin if this machine leads, otherwise the leader's.
async function leaderBase() {
  for (let i = 0; i < 20; i++) {
    const st = await refreshStatus();
    if (st && st.leader != null) return st.is_leader ? "" : st.leader_url;
    await sleep(1000);            // no leader yet: an election is running
  }
  throw new Error("No machine is receiving uploads right now.");
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------- uploads ----------
function addRow(file) {
  const li = document.createElement("li");
  li.innerHTML = `<span class="fname"></span><span class="state">Waiting</span>`;
  li.querySelector(".fname").textContent = file.name;
  $("uploads").prepend(li);
  return (cls, text) => { li.className = cls; li.querySelector(".state").textContent = text; };
}

// Re-encode as JPEG, largest side at most 2560 px, lowering quality until it fits under max.
async function shrink(file, max) {
  const img = await createImageBitmap(file, { imageOrientation: "from-image" });   // keeps phone rotation
  let side = 2560;
  for (let quality = 0.85; ; quality -= 0.1) {
    const scale = Math.min(1, side / Math.max(img.width, img.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", quality));
    if (blob && blob.size <= max) {
      return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
    }
    if (quality < 0.5) { side = Math.round(side * 0.75); quality = 0.95; }   // then shrink the pixels too
    if (side < 600) throw new Error("can't shrink");
  }
}

async function upload(file) {
  const set = addRow(file);
  const max = status?.max_photo_size ?? 3 * 1024 * 1024;
  if (file.type && !file.type.startsWith("image/")) return set("failed", "Not an image");
  if (file.size > max) {
    // Phone cameras take 4–12 MB photos. Shrink them in the browser instead of refusing them.
    set("waiting", "Making it smaller…");
    try { file = await shrink(file, max); }
    catch { return set("failed", `Larger than ${Math.round(max / 1048576)} MB and couldn't be resized`); }
  }

  const uploadId = uuid4();       // made once: every retry reuses it, so nothing is stored twice
  for (let attempt = 1; attempt <= 8; attempt++) {
    try {
      const base = await leaderBase();
      set("waiting", attempt === 1 ? "Uploading…" : `Uploading again (try ${attempt})…`);
      const r = await fetch(base + "/api/photos", {
        method: "POST",
        headers: { "X-Upload-Id": uploadId, "X-File-Name": encodeURIComponent(file.name),
                   "Content-Type": "application/octet-stream" },
        body: file,
      });
      if (r.status === 421) { await sleep(800); continue; }     // that machine stopped leading
      if (!r.ok) {
        const msg = (await r.json().catch(() => ({}))).detail;
        return set("failed", typeof msg === "string" ? msg : `Upload refused (${r.status})`);
      }
      const res = await r.json();
      const copies = res.confirmed_by.length + 1;
      if (res.saved) set("saved", `Saved on ${copies} machine${copies > 1 ? "s" : ""}`);
      else set("waiting", `Saved on ${copies}; ${res.missing.length} still copying`);
      refreshGallery();
      return;
    } catch {
      set("waiting", "Leader not answering, finding the new one…");   // failover: retry
      await sleep(1500);
    }
  }
  set("failed", "Couldn't reach a machine that accepts uploads. Try again.");
}

async function uploadAll(files) {
  for (const f of files) await upload(f);   // one at a time keeps the order on the roll
}

// ---------- gallery ----------
async function refreshGallery() {
  let list;
  try { list = await (await fetch("/api/photos", { cache: "no-store" })).json(); }
  catch { return; }
  const sig = list.map((p) => p.image_id).join(",");
  if (sig === shown) return;
  shown = sig;
  $("count").textContent = list.length ? `${list.length} photo${list.length > 1 ? "s" : ""}` : "";
  const strip = $("strip");
  strip.innerHTML = "";
  if (!list.length) {
    strip.innerHTML = `<p class="empty">No photos yet. Upload one to start the roll.</p>`;
    return;
  }
  for (const p of list) {
    const fig = document.createElement("figure");
    fig.className = "frame";
    fig.innerHTML = `<a target="_blank" rel="noopener"><img loading="lazy" alt=""></a>
      <figcaption><span class="no"></span><span class="file"></span></figcaption>
`;
    const url = `/api/photos/${encodeURIComponent(p.image_id)}`;
    fig.querySelector("a").href = url;
    fig.querySelector("img").src = url;
    fig.querySelector("img").alt = p.file_name;
    fig.querySelector(".no").textContent = `${p.seq}`;
    fig.querySelector(".file").textContent = p.file_name;
    fig.title = `Frame ${p.seq}, leadership period ${p.epoch}`;
    strip.appendChild(fig);
  }
}

// ---------- wiring ----------
$("files").addEventListener("change", (e) => { uploadAll([...e.target.files]); e.target.value = ""; });
document.querySelector(".choose").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("files").click(); }
});
const drop = $("drop");
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => uploadAll([...e.dataTransfer.files]));

// Touch screens can't drag files in, so say what they can do.
if (matchMedia("(pointer: coarse)").matches) {
  $("drop-title").textContent = "Add photos";
  $("limit").textContent = "Pick from your gallery or take one with the camera.";
}
refreshStatus().then(refreshGallery);
setInterval(refreshStatus, 2000);
setInterval(refreshGallery, 3000);
</script>
</body>
</html>
